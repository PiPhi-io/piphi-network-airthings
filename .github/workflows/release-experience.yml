name: Release Airthings dashboard experience

on:
  push:
    tags:
      - "experience-air-quality-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .[dev]

      - name: Test integration and experience contract
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Build signed package
        env:
          PIPHI_WIDGET_SIGNING_KEY_PEM_BASE64: ${{ secrets.PIPHI_WIDGET_SIGNING_KEY_PEM_BASE64 }}
        run: python scripts/build_experience.py

      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --verify-tag
          --generate-notes
          --title "Airthings Air Quality ${GITHUB_REF_NAME#experience-air-quality-v}"
